services:
  mysql:
    image: mysql:8.0
    container_name: studyassist_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studyassist
      MYSQL_USER: studyassist
      MYSQL_PASSWORD: studyassist
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

  app:
    build: .
    container_name: studyassist_app
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql://studyassist:studyassist@mysql:3306/studyassist
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret
      ADMIN_SECRET: local-admin-secret
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

volumes:
  mysql_data:
  node_modules:
